name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate tagged version
        run: |
          bash scripts/release.sh check
          env -u GITHUB_REF bash scripts/test-release.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-37.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure Android signing secrets in the release environment. See docs/releases.md.' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/griffboard-release.jks"
          chmod 600 "$RUNNER_TEMP/griffboard-release.jks"
      - name: Test and build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/griffboard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintRelease assembleRelease
      - name: Verify APK and prepare checksums
        run: |
          version="$(sed -n 's/^versionName=//p' version.properties)"
          mkdir release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/GriffBoard-$version.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose --print-certs "release-assets/GriffBoard-$version.apk"
          cd release-assets
          sha256sum ./*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(sed -n 's/^versionName=//p' version.properties)"
          tag="v$version"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          if gh release view "$tag" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo 'Release already published; refusing to replace its assets.' >&2; exit 1; }
          else
            gh release create "$tag" --verify-tag --draft --title "GriffBoard $version" --generate-notes
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --prerelease="$prerelease"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/griffboard-release.jks"
